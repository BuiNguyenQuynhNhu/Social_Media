version: '3.8'

services:
  app:
    build: .
    container_name: social_media_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENVIRONMENT=development
      - database.default.hostname=db
      - database.default.database=social_media
      - database.default.username=user
      - database.default.password=userpassword
      - database.default.DBDriver=MySQLi
    depends_on:
      - db
      - recommender

  db:
    image: mysql:8.0
    container_name: social_media_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: social_media
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  recommender:
    build: ./Recommender
    container_name: social_media_recommender
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=userpassword
      - DB_NAME=social_media
      - API_PORT=5000
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: social_media_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
