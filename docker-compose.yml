version: "3.9"

services:
  app:
    build: .
    container_name: ci4_app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - mysql
    environment:
      - CI_ENVIRONMENT=development

  mysql:
    image: mysql:8.0
    container_name: ci4_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ci_db
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
